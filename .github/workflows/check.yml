# The factory's required check: `make check` on macOS 15 (config lint, then `swift build` and `swift test` once
# Package.swift exists). Runs on every PR to main, draft or not, on pushes to main, and by hand
# (`gh workflow run "factory check" --ref <branch>`).
name: factory check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: factory check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: make check
        run: make check
