# Manufacture config for R4ph-t/skreenrek. Schema: the installed manufacture's core/PROJECT-CONF.md.
# KEY=value, # comments, never sourced. Onboarding only: no spec is Ready, so the factory has nothing to build yet.
NAME=skreenrek
REPO=R4ph-t/skreenrek
OWNER=R4ph-t
ROOT=.
SPEC_DIR=specs
SPEC_INDEX=specs/README.md
BRANCH_PREFIX=factory/
# `make`, not `xcode`: the package is unsandboxed Developer ID; signing, notarization and permission prompts are out of scope for factory ticks.
PROFILE=make
MAKE_TARGETS=check
TOOLS=git make swift
# Required check is the `factory check` workflow (.github/workflows/check.yml). The gate still does not merge on its own (AUTO_MERGE=0).
CI_WORKFLOW=factory check
CHECK_NAME=factory check
RISKY_PATHS=.factory/risky-paths.txt
GUARDED_PATHS=^\.factory/|^\.github/|^\.claude/|^\.agents/|^\.cursor/|^Makefile$|^scripts/|^AGENTS\.md$|^CLAUDE\.md$|\.entitlements$|(^|/)[^/]*Info\.plist$|\.xcprivacy$|^RELEASE_PROCESS\.md$|^\.release\.env|(^|/)[^/]*notariz[^/]*$|(^|/)[^/]*codesign[^/]*$
VM=none
PROMPT_EXTRA=AGENTS.md
# Raph merges every PR.
AUTO_MERGE=1
STATE_DIR=~/.factory/skreenrek
